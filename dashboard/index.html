<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLC Automation Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#262757',
                            light: '#3b3d7a',
                            accent: '#6366f1'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 40px -10px rgba(38, 39, 87, 0.1);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-slate-50">

    <div class="glass-card max-w-lg w-full p-8 md:p-10 relative overflow-hidden">
        <!-- Decorative Header Background -->
        <div class="absolute top-0 left-0 w-full h-32 bg-brand-dark rounded-t-2xl z-0"></div>
        
        <div class="relative z-10">
            <div class="text-center mb-8 mt-2">
                <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg text-brand-dark text-3xl font-bold border-4 border-slate-50">
                    BLC
                </div>
                <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Automation Panel</h1>
                <p class="text-sm mt-1 text-slate-500 font-medium">Daily LinkedIn Quotes Simplified</p>
            </div>

            <div class="space-y-6">
                <!-- Token Section -->
                <div class="bg-slate-50 p-5 rounded-xl border border-slate-100">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">
                        <i class="fa-solid fa-key text-brand-accent mr-2"></i> GitHub Auth Token
                    </label>
                    <input type="password" id="gh-token" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-brand-accent focus:border-brand-accent outline-none transition-all text-sm" placeholder="ghp_xxxxxxxxxxxx">
                    <p class="text-xs text-slate-400 mt-2"><i class="fa-solid fa-lock mr-1"></i> Saved securely in your browser.</p>
                </div>

                <!-- Schedule Section -->
                <div class="bg-slate-50 p-5 rounded-xl border border-slate-100">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">
                        <i class="fa-regular fa-clock text-brand-accent mr-2"></i> Daily Post Time (IST)
                    </label>
                    <div class="flex gap-3">
                        <input type="time" id="time-input" class="flex-1 px-4 py-3 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-brand-accent focus:border-brand-accent outline-none transition-all text-lg font-medium text-slate-700">
                        <button onclick="updateTime()" class="bg-brand-dark hover:bg-brand-light text-white px-6 py-3 rounded-lg transition-all font-semibold shadow-md flex items-center">
                            <i class="fa-solid fa-check mr-2"></i> Save
                        </button>
                    </div>
                </div>

                <!-- Trigger Action -->
                <div class="pt-4">
                    <button id="trigger-btn" onclick="triggerWorkflow()" class="w-full bg-gradient-to-r from-brand-accent to-blue-500 hover:from-blue-600 hover:to-brand-accent text-white font-bold py-4 px-4 rounded-xl transition-all shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 flex items-center justify-center text-lg">
                        <i class="fa-solid fa-rocket mr-3"></i> Post Quote Now
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const REPO_OWNER = 'Rushikeshkhadke';
        const REPO_NAME = 'linkedin-quote-automation';
        const WORKFLOW_FILE = 'publish_quote.yml';

        document.addEventListener("DOMContentLoaded", () => {
            const savedToken = localStorage.getItem('gh_token');
            if (savedToken) document.getElementById('gh-token').value = savedToken;
        });

        function getToken() {
            const token = document.getElementById('gh-token').value.trim();
            if (token) localStorage.setItem('gh_token', token);
            return token;
        }

        const Toast = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 4000,
            timerProgressBar: true,
        });

        async function triggerWorkflow() {
            const token = getToken();
            if (!token) return Toast.fire({ icon: 'error', title: 'Please enter GitHub Token' });

            const btn = document.getElementById('trigger-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-3"></i> Processing...`;
            btn.disabled = true;
            
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_FILE}/dispatches`, {
                    method: 'POST',
                    headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' },
                    body: JSON.stringify({ ref: 'master' })
                });

                if (res.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Launched!',
                        text: 'Your quote is being generated and will be live on LinkedIn in 1-2 minutes.',
                        confirmButtonColor: '#262757'
                    });
                } else {
                    const data = await res.json();
                    Toast.fire({ icon: 'error', title: data.message });
                }
            } catch (err) {
                Toast.fire({ icon: 'error', title: err.message });
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function updateTime() {
            const token = getToken();
            const timeVal = document.getElementById('time-input').value;
            if (!token) return Toast.fire({ icon: 'error', title: 'Please enter GitHub Token' });
            if (!timeVal) return Toast.fire({ icon: 'warning', title: 'Please select a time' });

            Toast.fire({ icon: 'info', title: 'Updating schedule...' });

            let [hours, minutes] = timeVal.split(':').map(Number);
            let utcHours = hours - 5;
            let utcMinutes = minutes - 30;
            if (utcMinutes < 0) { utcMinutes += 60; utcHours -= 1; }
            if (utcHours < 0) utcHours += 24;
            
            const cronStr = `${utcMinutes} ${utcHours} * * *`;

            try {
                const getRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/.github/workflows/${WORKFLOW_FILE}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (!getRes.ok) throw new Error("Failed to access repository.");
                const fileData = await getRes.json();
                
                let content = atob(fileData.content);
                content = content.replace(/cron: '.*'/, `cron: '${cronStr}'`);
                const newContentEncoded = btoa(content);

                const updateRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/.github/workflows/${WORKFLOW_FILE}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' },
                    body: JSON.stringify({
                        message: `Update schedule to ${timeVal} IST via Dashboard`,
                        content: newContentEncoded,
                        sha: fileData.sha,
                        branch: 'master'
                    })
                });

                if (updateRes.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Schedule Updated!',
                        text: `Your daily quotes will now be posted at ${timeVal} IST.`,
                        confirmButtonColor: '#262757'
                    });
                } else {
                    const errorData = await updateRes.json();
                    Toast.fire({ icon: 'error', title: errorData.message });
                }
            } catch (err) {
                Toast.fire({ icon: 'error', title: err.message });
            }
        }
    </script>
</body>
</html>
