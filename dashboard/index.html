<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Quote Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; font-family: 'Inter', sans-serif; }
        .loader { border-top-color: #3498db; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">LinkedIn Automation</h1>
            <p class="text-sm text-gray-500 mt-2">Manage your daily quotes easily</p>
        </div>

        <div id="setup-section" class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-1">GitHub Personal Access Token</label>
            <input type="password" id="gh-token" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="ghp_xxxxxxxxxxxx">
            <p class="text-xs text-gray-400 mt-1">Requires 'repo' and 'workflow' scopes. Saved locally in your browser.</p>
        </div>

        <div class="space-y-4">
            <!-- Trigger Button -->
            <button id="trigger-btn" onclick="triggerWorkflow()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center">
                <span>🚀 Trigger Post Now</span>
            </button>

            <div class="relative flex items-center py-4">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink-0 mx-4 text-gray-400 text-sm">Schedule</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <!-- Change Time -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Daily Post Time (IST)</label>
                <div class="flex gap-2">
                    <input type="time" id="time-input" class="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <button onclick="updateTime()" class="bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded-lg transition duration-200">Save</button>
                </div>
                <p id="status-msg" class="text-sm mt-3 text-center hidden"></p>
            </div>
        </div>
    </div>

    <script>
        const REPO_OWNER = 'Rushikeshkhadke';
        const REPO_NAME = 'linkedin-quote-automation';
        const WORKFLOW_FILE = 'publish_quote.yml';

        // Load token on start
        document.addEventListener("DOMContentLoaded", () => {
            const savedToken = localStorage.getItem('gh_token');
            if (savedToken) document.getElementById('gh-token').value = savedToken;
        });

        function getToken() {
            const token = document.getElementById('gh-token').value.trim();
            if (token) localStorage.setItem('gh_token', token);
            return token;
        }

        function showStatus(msg, isError = false) {
            const el = document.getElementById('status-msg');
            el.textContent = msg;
            el.className = `text-sm mt-3 text-center block ${isError ? 'text-red-500' : 'text-green-600'}`;
            setTimeout(() => { el.classList.add('hidden'); }, 5000);
        }

        async function triggerWorkflow() {
            const token = getToken();
            if (!token) return showStatus("Please enter your GitHub Token first.", true);

            const btn = document.getElementById('trigger-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<div class="loader ease-linear rounded-full border-2 border-t-2 border-white h-5 w-5 mr-2"></div> Processing...`;
            
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_FILE}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({ ref: 'master' })
                });

                if (res.ok) {
                    showStatus("✅ Automation triggered! Post will be live in 1-2 mins.");
                } else {
                    const data = await res.json();
                    showStatus(`Error: ${data.message}`, true);
                }
            } catch (err) {
                showStatus(`Error: ${err.message}`, true);
            } finally {
                btn.innerHTML = originalText;
            }
        }

        async function updateTime() {
            const token = getToken();
            const timeVal = document.getElementById('time-input').value;
            if (!token) return showStatus("Please enter your GitHub Token first.", true);
            if (!timeVal) return showStatus("Please select a time.", true);

            showStatus("Updating schedule...");

            // Convert IST to UTC for cron
            let [hours, minutes] = timeVal.split(':').map(Number);
            let utcHours = hours - 5;
            let utcMinutes = minutes - 30;
            if (utcMinutes < 0) {
                utcMinutes += 60;
                utcHours -= 1;
            }
            if (utcHours < 0) utcHours += 24;
            
            const cronStr = `${utcMinutes} ${utcHours} * * *`;

            try {
                // 1. Get current file sha and content
                const getRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/.github/workflows/${WORKFLOW_FILE}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (!getRes.ok) throw new Error("Failed to fetch workflow file.");
                const fileData = await getRes.json();
                
                // 2. Decode content, replace cron, encode again
                let content = atob(fileData.content);
                content = content.replace(/cron: '.*'/, `cron: '${cronStr}'`);
                const newContentEncoded = btoa(content);

                // 3. Update file
                const updateRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/.github/workflows/${WORKFLOW_FILE}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({
                        message: `Update schedule to ${timeVal} IST via Dashboard`,
                        content: newContentEncoded,
                        sha: fileData.sha,
                        branch: 'master'
                    })
                });

                if (updateRes.ok) {
                    showStatus(`✅ Time successfully updated to ${timeVal} IST!`);
                } else {
                    const errorData = await updateRes.json();
                    showStatus(`Error: ${errorData.message}`, true);
                }
            } catch (err) {
                showStatus(`Error: ${err.message}`, true);
            }
        }
    </script>
</body>
</html>
